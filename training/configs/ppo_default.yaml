# PPO Training Configuration for F1 Racing Simulator
# Optimized for laptop training (computationally efficient)

algorithm: PPO

# Environment settings
env:
  num_envs: 4  # Parallel environments for faster training
  max_episode_steps: 2000

# PPO Hyperparameters
hyperparameters:
  learning_rate: 0.0003
  n_steps: 2048           # Steps per environment before update
  batch_size: 64          # Minibatch size
  n_epochs: 10            # Number of epochs when optimizing
  gamma: 0.99             # Discount factor
  gae_lambda: 0.95        # GAE lambda for advantage estimation
  clip_range: 0.2         # PPO clipping parameter
  ent_coef: 0.01          # Entropy coefficient for exploration
  vf_coef: 0.5            # Value function coefficient
  max_grad_norm: 0.5      # Max gradient norm for clipping

# Network architecture
policy:
  type: MlpPolicy
  net_arch:
    pi: [64, 64]    # Policy network
    vf: [64, 64]    # Value network

# Training settings
training:
  total_timesteps: 2000000   # 2M steps for overnight training (~4-6 hours)
  save_freq: 25000           # Save checkpoint every 25K steps
  eval_freq: 10000           # Evaluate every 10K steps
  n_eval_episodes: 5         # Episodes per evaluation
  log_interval: 1            # Log every N updates

# Reward configuration
rewards:
  velocity_reward_scale: 0.01
  checkpoint_bonus: 100.0
  lap_bonus: 500.0
  crash_penalty: -100.0
  time_penalty: -0.1

# Paths
paths:
  log_dir: logs
  model_dir: models
  tensorboard_dir: logs/tensorboard
