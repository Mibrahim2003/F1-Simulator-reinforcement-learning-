# PPO Training Configuration for F1 Racing Simulator - FAST MODE
# Optimized for GPU + Multi-Core CPU

algorithm: PPO

# Environment settings
env:
  num_envs: 8            # Run 8 simulations in parallel (Uses 8 CPU cores)
  max_episode_steps: 5000 # Longer episodes for complex tracks

# PPO Hyperparameters (Tuned for GPU)
hyperparameters:
  learning_rate: 0.0003
  n_steps: 4096           # Longer rollout (8 * 4096 = 32k steps per update)
  batch_size: 256         # Larger batch size for GPU efficiency
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture (Deeper for complex physics)
policy:
  type: MlpPolicy
  net_arch:
    pi: [128, 128]    # Deeper network
    vf: [128, 128]

# Training settings
training:
  total_timesteps: 5000000   # 5M steps (Needed for Pro Physics)
  save_freq: 50000           # Less frequent saving
  eval_freq: 50000
  n_eval_episodes: 5
  log_interval: 1

# Reward configuration (Same as default)
rewards:
  velocity_reward_scale: 0.01
  checkpoint_bonus: 100.0
  lap_bonus: 500.0
  crash_penalty: -100.0
  time_penalty: -0.1

paths:
  log_dir: logs
  model_dir: models
  tensorboard_dir: logs/tensorboard
